# Static atlas on the apex; the existing game backend stays on this host.
map $arg_v $witch_image_ttl {
    default 7d;
    "~^[0-9a-f]{16}$" 365d;
}
map $http_upgrade $witch_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    listen [::]:80;
    server_name witchwildhunt.top www.witchwildhunt.top;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
    location / { return 301 https://witchwildhunt.top$request_uri; }
}
server {
    listen 80;
    listen [::]:80;
    server_name game.witchwildhunt.top;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
    location / { return 301 https://game.witchwildhunt.top$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.witchwildhunt.top;
    ssl_certificate /etc/letsencrypt/live/witchwildhunt.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/witchwildhunt.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://witchwildhunt.top$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name game.witchwildhunt.top;
    ssl_certificate /etc/letsencrypt/live/game.witchwildhunt.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.witchwildhunt.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:witch_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    root /opt/witch/app/apps/web/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 8m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/xml image/svg+xml application/manifest+json;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://game.witchwildhunt.top wss://game.witchwildhunt.top; font-src 'self' data:; media-src 'self' blob:; form-action 'self'" always;
    location /assets/ { try_files $uri =404; expires 1y; }
    location ~* \.(?:avif|webp|png|jpe?g|svg|woff2?|ico)$ { try_files $uri =404; expires $witch_image_ttl; }
    location = /index.html { expires -1; }
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $witch_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name witchwildhunt.top;
    ssl_certificate /etc/letsencrypt/live/witchwildhunt.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/witchwildhunt.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    root /opt/witch/atlas/current;
    index index.html;
    error_page 404 /404.html;
    server_tokens off;
    client_max_body_size 8m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/xml image/svg+xml;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Next static exports contain inline hydration scripts; there is no dynamic server here.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; form-action 'self'" always;
    location ^~ /_next/static/ { try_files $uri =404; expires 1y; }
    location ^~ /game/ { try_files $uri =404; expires $witch_image_ttl; }
    location = /catalog { return 302 /; }
    location ~ ^/(?:login|register|recover|lobby|rooms|account|players|system|woodpecker|avatar-frames|feedback|admin|power)(?:/|$) {
        return 302 https://game.witchwildhunt.top$request_uri;
    }
    # Compatibility for already-open game tabs. The atlas never calls these routes.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $witch_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location ^~ /assets/ { root /opt/witch/app/apps/web/dist; try_files $uri =404; expires 1y; }
    location ~* ^/(?:avatars|backgrounds|cards|fonts|higher-battlefield|icons|legend|ranks|rulebook|stickers|support|table|temples)/.*\.(?:avif|webp|png|jpe?g|svg|woff2?|ico)$ {
        root /opt/witch/app/apps/web/dist;
        try_files $uri =404;
        expires $witch_image_ttl;
    }
    location ~* \.(?:avif|webp|png|jpe?g|svg|woff2?|ico)$ { try_files $uri =404; expires 7d; }
    location ~* \.(?:html|txt)$ { try_files $uri =404; expires -1; }
    location / { try_files $uri $uri/ =404; expires -1; }
}
